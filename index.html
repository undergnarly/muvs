<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muvs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script>
    if (!/^\/(?:admin|login|projects|dubplates)(?:\/|$)/.test(location.pathname)) {
      ['/videos/objects/music-v3-poster.webp', '/videos/objects/mixes-v3-poster.webp', '/videos/objects/code-v3-poster.webp'].forEach(function (href) {
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.crossOrigin = 'anonymous';
        link.href = href;
        link.fetchPriority = 'high';
        document.head.appendChild(link);
      });
    }
    if (/^\/dubplates\/?$/.test(location.pathname)) {
      var robots = document.createElement('meta');
      robots.name = 'robots';
      robots.content = 'noindex, nofollow, noarchive';
      document.head.appendChild(robots);
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Optional reading-page fonts must not reject the main Vite CSS chunk. -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="splash-screen" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(to bottom,#767676,#8f8f8fc2 35%,#ffffff);transition:opacity .6s ease">
    <style>#splash-screen.hidden{opacity:0;pointer-events:none}</style>
    <div style="text-align:center;font-family:Urbanist,sans-serif">
      <div style="width:140px;height:70px;margin:0 auto;background-color:#fff;-webkit-mask:url('/images/logo.png') center/contain no-repeat;mask:url('/images/logo.png') center/contain no-repeat"></div>
      <div style="margin-top:22px;width:180px;height:2px;background:rgba(255,255,255,0.35);border-radius:1px;overflow:hidden">
        <div id="splash-bar" style="width:0%;height:100%;background:#ffffff;border-radius:1px;transition:width .3s ease"></div>
      </div>
      <div id="splash-status" style="margin-top:10px;font-size:11px;font-weight:500;letter-spacing:.18em;color:rgba(255,255,255,0.85)">LOADING</div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
