        var splash = document.getElementById('splash-screen');
        if (!splash || splash.classList.contains('hidden')) return;
        splash.classList.add('failed');
        var progress = document.getElementById('splash-progress');
        if (progress) progress.hidden = true;
        var status = document.getElementById('splash-status');
        if (status) status.textContent = 'Couldn’t load. Check your connection and try again.';
        var retry = document.getElementById('splash-retry');
        if (retry) {
          retry.href = location.href;
          retry.hidden = false;
          retry.addEventListener('click', function (event) {
            event.preventDefault();
            location.reload();
          });
        }
      }, 18000);
      window.addEventListener('muvs:app-mounted', function () {
        clearTimeout(earlyBootTimer);
      }, { once: true });
    })();
  </script>
