    if (!/^\/(?:admin|login|projects|dubplates)(?:\/|$)/.test(location.pathname)) {
      ['/videos/objects/music-v3-poster.webp', '/videos/objects/mixes-v3-poster.webp', '/videos/objects/code-v3-poster.webp'].forEach(function (href) {
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.crossOrigin = 'anonymous';
        link.href = href;
        link.fetchPriority = 'high';
        document.head.appendChild(link);
      });
    }
    if (/^\/dubplates\/?$/.test(location.pathname)) {
      var robots = document.createElement('meta');
      robots.name = 'robots';
      robots.content = 'noindex, nofollow, noarchive';
      document.head.appendChild(robots);
    }
    // Runs before the module bundle: a missing/stalled bundle still needs a way out.
    (function () {
      var earlyBootTimer = setTimeout(function () {
        var splash = document.getElementById('splash-screen');
        if (!splash || splash.classList.contains('hidden')) return;
        splash.classList.add('failed');
        var progress = document.getElementById('splash-progress');
        if (progress) progress.hidden = true;
        var status = document.getElementById('splash-status');
        if (status) status.textContent = 'Couldn’t load. Check your connection and try again.';
        var retry = document.getElementById('splash-retry');
        if (retry) {
          retry.href = location.href;
          retry.hidden = false;
          retry.addEventListener('click', function (event) {
            event.preventDefault();
            location.reload();
          });
        }
      }, 18000);
      window.addEventListener('muvs:app-mounted', function () {
        clearTimeout(earlyBootTimer);
      }, { once: true });
    })();
  </script>
