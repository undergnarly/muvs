# Shared security policy without a referrer default (Dubplates uses no-referrer).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=15552000" always;
# Inline priority bootstrap/styles and same-origin Troika blob workers are used.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://w.soundcloud.com; connect-src 'self' data: https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
