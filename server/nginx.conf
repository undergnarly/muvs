## Reference MUVS website server only. Production has additional application
## locations: merge these owned blocks, never overwrite the live vhost file.
server {
    server_name muvs.dev;
    include /etc/nginx/snippets/muvs-dubplates.conf;
    
    root /var/www/muvs-current/dist;
    index index.html;
    server_tokens off;

    # Backend API Proxy
    location /api/ {
        include /etc/nginx/snippets/muvs-cloudflare-realip.conf;
        client_max_body_size 100M;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Muvs-Document-Uri "";
        proxy_cache off;
        proxy_hide_header Cache-Control;
        include /etc/nginx/snippets/muvs-hide-upstream-security.conf;
        include /etc/nginx/snippets/muvs-security-headers.conf;
        add_header Cache-Control "private, no-store" always;
    }

    # Uploads Storage
    location ^~ /uploads/ {
        if ($uri ~ /\.) { return 404; }
        root /var/www/muvs-data;
        try_files $uri =404;
        include /etc/nginx/snippets/muvs-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, no-transform";
    }

    # Always render the root through the document handler, not nginx's index
    # internal redirect. Semantic deep links and unknown routes share its 404s.
    location = / {
        proxy_pass http://127.0.0.1:3001/api/public-document;
        include /etc/nginx/snippets/muvs-document-proxy.conf;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3001/api/public-document;
        include /etc/nginx/snippets/muvs-document-proxy.conf;
    }
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001/api/public-document;
        include /etc/nginx/snippets/muvs-document-proxy.conf;
    }
    location = /index.html {
        include /etc/nginx/snippets/muvs-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        return 301 /;
    }
    location / {
        include /etc/nginx/snippets/muvs-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri @muvs_document;
    }
    location @muvs_document {
        rewrite ^ /api/public-document break;
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/muvs-document-proxy.conf;
    }

    location ~ (^|/)\.(?!well-known(?:/|$)) {
        include /etc/nginx/snippets/muvs-security-headers.conf;
        return 404;
    }
    # Only build content-addressed filenames are immutable. Artwork with a
    # stable filename must be refreshable when the owner replaces it.
    location ~ "^/assets/[A-Za-z0-9_-]+-[A-Za-z0-9_-]{8,}\.(?:js|css|png|jpe?g|svg|webp|avif|woff2?)$" {
        try_files $uri =404;
        include /etc/nginx/snippets/muvs-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|eot|mp4|webm|mp3|wav|glb|gltf|bin|json|map|txt|xml)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/muvs-security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/muvs.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muvs.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name muvs.dev www.muvs.dev;
    include /etc/nginx/snippets/muvs-security-headers.conf;
    return 301 https://muvs.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name www.muvs.dev;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/muvs.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muvs.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/muvs-security-headers.conf;
    return 301 https://muvs.dev$request_uri;
}
