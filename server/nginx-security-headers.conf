# Include in each MUVS-owned location which sets add_header. nginx 1.24 does
# not merge parent add_header directives after a child adds even one header.
# Do not put this at the shared vhost level: unrelated demo apps live there.
include /etc/nginx/snippets/muvs-security-base.conf;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
