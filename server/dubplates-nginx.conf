# Include inside muvs.dev's TLS server block, preserving unrelated routes.
location = /dubplates {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /dubplates.html =404;
}
location = /dubplates/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 302 /dubplates;
}
location = /dubplates.html {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /api/dubplates {
    client_max_body_size 205M;
    client_body_timeout 120s;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    # Let Express reject unauthenticated/over-limit uploads before nginx buffers them to disk.
    proxy_request_buffering off;
    proxy_buffering off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
