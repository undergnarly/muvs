# Include inside muvs.dev's TLS server block, preserving unrelated routes.
location = /dubplates {
    include /etc/nginx/snippets/muvs-security-base.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "private, no-store" always;
    try_files /dubplates.html =404;
}
location = /dubplates/ {
    include /etc/nginx/snippets/muvs-security-base.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "private, no-store" always;
    return 302 /dubplates;
}
location = /dubplates.html {
    include /etc/nginx/snippets/muvs-security-base.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "private, no-store" always;
}
location ^~ /api/dubplates {
    include /etc/nginx/snippets/muvs-cloudflare-realip.conf;
    client_max_body_size 96M;
    client_body_timeout 120s;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Muvs-Document-Uri "";
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    # Let Express reject unauthenticated/over-limit uploads before nginx buffers them to disk.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Robots-Tag;
    include /etc/nginx/snippets/muvs-hide-upstream-security.conf;
    include /etc/nginx/snippets/muvs-security-base.conf;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
